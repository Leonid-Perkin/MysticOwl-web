<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MysticOwl — Интерактивные расклады и энциклопедия Арканов Таро" />
    <meta name="theme-color" content="#0E0918" />

    <!-- iOS PWA meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MysticOwl" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <title>MysticOwl — Расклады Таро</title>
  </head>
  <body class="bg-[#0E0918] text-[#F5EFE6] min-h-screen selection:bg-[#D4AF37]/30 selection:text-[#FFE082] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.updateMysticOwlApp = async function() {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) {
              await reg.update();
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
            }
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
        } catch (err) {
          console.warn('Error clearing PWA cache:', err);
        } finally {
          window.location.reload();
        }
      };
    </script>
  </body>
</html>
